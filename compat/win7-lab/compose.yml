name: genoffice-win7

services:
  win7:
    image: docker.io/dockurr/windows@sha256:16fd7c39a3e48bb946d29c59dc6015942e5b900a1fa5d7e5552053bfc48ee2ea
    platform: linux/amd64
    environment:
      VERSION: '7u'
      RAM_SIZE: 4G
      CPU_CORES: '2'
      DISK_SIZE: 48G
      USERNAME: GenOfficeLab
      PASSWORD: ${GENOFFICE_WIN7_PASSWORD:?Set the local Win7 lab password}
    devices:
      - /dev/kvm
      - /dev/net/tun
    cap_add:
      - NET_ADMIN
    ports:
      - '127.0.0.1::8006'
    stop_grace_period: 2m
    volumes:
      - type: bind
        source: ${GENOFFICE_WIN7_ISO:?Set the Win7 SP1 x64 ISO path}
        target: /custom.iso
        read_only: true
        bind:
          create_host_path: false
      - win7-storage:/storage
      - type: bind
        source: ${GENOFFICE_WIN7_LAB:?Set the lab directory}/shared
        target: /shared
        bind:
          create_host_path: false

volumes:
  win7-storage:
